name: TodoApp
options:
  bundleIdPrefix: com.d0ne1s
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

targets:
  TodoApp:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - target: TodoWidgetExtension
      - target: TodoShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.d0ne1s.todoapp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: DEVELOPMENT_TEAM_PLACEHOLDER
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  TodoWidgetExtension:
    type: app-extension
    platform: iOS
    # WidgetKit push（WidgetPushHandler）が iOS 26 から
    deploymentTarget: "26.0"
    sources:
      - path: Widget
        excludes:
          - Info.plist
      - path: Sources/Theme.swift
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: TodoWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    # WidgetKit push を受けるため。実機には Development 署名で入れる（todo:device・todo:ota とも）ので development
    entitlements:
      path: Widget/TodoWidget.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.d0ne1s.todoapp.widget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: DEVELOPMENT_TEAM_PLACEHOLDER

  # 共有シートの「Today」。API クライアントと Secrets はアプリ本体のものを使う
  TodoShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - Info.plist
      - path: Sources/API/APIClient.swift
      - path: Sources/Models/Todo.swift
      - path: Sources/Secrets.swift
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Today
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.d0ne1s.todoapp.share
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: DEVELOPMENT_TEAM_PLACEHOLDER
